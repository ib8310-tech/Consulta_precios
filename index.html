<style>
*{box-sizing:border-box} body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:16px 13px 35px}
.header{background:#17365d;color:white;border-radius:18px;padding:19px 17px;box-shadow:0 4px 14px #0002}

label{display:block;font-weight:700;margin:17px 3px 7px}

.card{background:white;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 9px #0001}
.name{font-size:17px;font-weight:800;margin-bottom:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.price{background:#eef5fb;border-radius:11px;padding:10px}
.price span{display:block;font-size:11px;color:#667085} .price strong{display:block;font-size:19px;margin-top:3px}
.lab{font-size:12px;color:#667085;margin-top:9px} .empty{text-align:center;color:#667085;padding:35px 10px}
</style>

const q=document.getElementById('q');
const results=document.getElementById('results');
const count=document.getElementById('count');

function norm(s) {
  return String(s ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9 ]/gi,' ')
    .replace(/\s+/g,' ')
    .trim()
    .toUpperCase();
}

function money(v) {
  if(v===null || v===undefined || v==='') return '—';
  const n=Number(v);
  return Number.isFinite(n) ? 'S/ '+n.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}) : String(v);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render() {
  const term=norm(q.value);
  if(!term) {
    count.textContent='';
    results.innerHTML='<div class="empty">Escribe para comenzar.</div>';
    return;
  }

  // Match the beginning of the normalized product name, ignoring punctuation.
  const found=PRODUCTS.filter(p => norm(p.producto).startsWith(term)).slice(0,50);

  count.textContent=found.length ? found.length+' resultado(s)' : 'Sin coincidencias';

  if(!found.length) {
    results.innerHTML='<div class="empty">No encontré coincidencias.<br><br>Prueba con menos letras.</div>';
    return;
  }

  results.innerHTML=found.map(p => `
    <div class="card">
      <div class="name">${esc(p.producto)}</div>
      <div class="grid">
        <div class="price"><span>PRECIO UNITARIO</span><strong>${money(p.unitario)}</strong></div>
        <div class="price"><span>PRECIO POR CAJA</span><strong>${money(p.caja)}</strong></div>
      </div>
      ${p.laboratorio ? '<div class="lab">Laboratorio: '+esc(p.laboratorio)+'</div>' : ''}
    </div>`).join('');
}

q.addEventListener('input', render);
q.addEventListener('keyup', render);
q.addEventListener('change', render);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
