<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057A8"><link rel="manifest" href="manifest.webmanifest">
<title>BALBIN_FARMATODO — Consulta de precios</title>
<style>
:root{--b:#0057A8;--b2:#0072CE;--o:#F58220;--bg:#f5f7fa;--t:#18324a;--m:#66788a;--l:#e2e8ee}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t)}
.app{max-width:760px;margin:auto;min-height:100vh}.header{background:linear-gradient(135deg,var(--b),var(--b2));color:white;padding:24px 18px 28px;border-radius:0 0 24px 24px;box-shadow:0 5px 18px #0002}
.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:15px;background:#fff;display:grid;place-items:center}.logo svg{width:37px;height:37px}
.brand-name{font-weight:850;letter-spacing:-.6px;font-size:25px;line-height:1}.brand-name span{color:#ffd2ae}.subtitle{margin:8px 0 0 66px;font-size:14px}
.search-wrap{margin-top:20px;position:relative}.search{width:100%;height:60px;border:0;border-radius:17px;padding:0 50px 0 18px;font-size:19px;outline:0;box-shadow:0 4px 14px #0002;color:var(--t)}.search::placeholder{color:#8292a1}
.clear{position:absolute;right:9px;top:9px;width:42px;height:42px;border:0;border-radius:13px;background:#edf2f7;color:#66788a;font-size:22px;display:none}
.content{padding:18px}.status{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;color:var(--m);font-size:14px}.update{border:0;background:transparent;color:var(--b);font-weight:700;font-size:13px;padding:5px}
.results{display:grid;gap:13px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:17px;box-shadow:0 2px 9px #18324a10}
.product{font-size:18px;font-weight:850;line-height:1.25;margin-bottom:13px;text-transform:uppercase}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:15px}.item{min-width:0}.label{display:block;color:var(--m);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}.value{font-size:17px;font-weight:750}.lab{grid-column:1/-1}
.ok{width:100%;height:56px;border:0;border-radius:15px;background:var(--o);color:#fff;font-size:20px;font-weight:850;box-shadow:0 3px 8px #f582203f;touch-action:manipulation}.ok:active{transform:scale(.985)}
.empty{text-align:center;padding:45px 20px;color:var(--m)}.empty .icon{font-size:42px;margin-bottom:10px}.empty strong{display:block;color:var(--t);font-size:17px;margin-bottom:6px}.loading{text-align:center;padding:28px;color:var(--m)}
.footer{text-align:center;color:#8a98a5;font-size:11px;padding:16px 18px 28px}
</style></head><body><div class="app">
<header class="header"><div class="brand"><div class="logo"><svg viewBox="0 0 48 48"><rect x="15" y="3" width="18" height="42" rx="6" fill="#F58220"/><rect x="3" y="15" width="42" height="18" rx="6" fill="#F58220"/><circle cx="24" cy="24" r="5.5" fill="#fff"/></svg></div><div class="brand-name">BALBIN<span>_FARMATODO</span></div></div>
<div class="subtitle">CONSULTA DE PRECIOS</div><div class="search-wrap"><input id="search" class="search" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="🔍  Buscar producto..." aria-label="Buscar producto"><button id="clear" class="clear" aria-label="Limpiar búsqueda">×</button></div></header>
<main class="content"><div class="status"><span id="statusText">Cargando precios…</span><button id="update" class="update">↻ Actualizar precios</button></div><section id="results" class="results"><div class="loading">Cargando la lista de precios…</div></section></main>
<div class="footer">Uso personal · Los precios se consultan desde precios.xlsx</div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const DATA_URL='./precios.xlsx';let products=[];const $=id=>document.getElementById(id);const search=$('search'),results=$('results'),statusText=$('statusText'),clearBtn=$('clear');
function money(v){if(v===null||v===undefined||v===''||Number(v)===0)return'—';const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?'S/ '+n.toFixed(2):String(v)}
function norm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseRows(rows){return rows.map(r=>({product:r.PRODUCTO??r.Producto??r.producto??'',unit:r.PRECIOF??r.PrecioF??r.preciof??0,box:r.PRECIO??r.Precio??r.precio??0,lab:r.LABORATORI??r.Laboratori??r.LABORATORIO??r.Laboratorio??''})).filter(x=>String(x.product).trim())}
async function loadPrices(){statusText.textContent='Cargando precios…';results.innerHTML='<div class="loading">Cargando la lista de precios…</div>';try{const res=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error();const wb=XLSX.read(await res.arrayBuffer(),{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];products=parseRows(XLSX.utils.sheet_to_json(sh,{defval:''}));statusText.textContent=products.length.toLocaleString('es-PE')+' productos disponibles';render('')}catch(e){statusText.textContent='No se pudieron cargar los precios';results.innerHTML='<div class="empty"><div class="icon">⚠️</div><strong>No se pudo cargar la lista</strong><span>Verifica tu conexión y vuelve a intentar.</span></div>'}}
function render(query){clearBtn.style.display=query?'block':'none';if(!query){results.innerHTML='<div class="empty"><div class="icon">🔎</div><strong>Busca un producto</strong><span>Escribe las primeras 3 o 4 letras del nombre.</span></div>';return}const q=norm(query).replace(/\s+/g,'');if(q.length<3){results.innerHTML='<div class="empty"><div class="icon">⌨️</div><strong>Escribe al menos 3 letras</strong><span>La búsqueda se hace únicamente desde el inicio del nombre del producto.</span></div>';return}const matches=products.filter(p=>norm(p.product).startsWith(q)).slice(0,60);if(!matches.length){results.innerHTML='<div class="empty"><div class="icon">🔍</div><strong>No encontramos coincidencias</strong><span>Prueba con las primeras letras del nombre del producto.</span></div>';return}results.innerHTML=matches.map(p=>`<article class="card"><div class="product">${esc(p.product)}</div><div class="info"><div class="item"><span class="label">Unidad</span><span class="value">${money(p.unit)}</span></div><div class="item"><span class="label">Caja</span><span class="value">${money(p.box)}</span></div><div class="item lab"><span class="label">Laboratorio</span><span class="value">${esc(p.lab||'—')}</span></div></div><button class="ok">OK</button></article>`).join('');results.querySelectorAll('.ok').forEach(b=>b.onclick=resetAfterOk)}
function resetAfterOk(){search.value='';render('');clearBtn.style.display='none';search.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
search.oninput=()=>render(search.value);clearBtn.onclick=()=>{search.value='';render('');search.focus()};$('update').onclick=()=>loadPrices();loadPrices();
</script></body></html>
