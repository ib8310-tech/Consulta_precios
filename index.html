<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1261A0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balbin Presupuesto">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Balbin – Presupuesto</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#17202a}
header{background:#1261A0;color:#fff;padding:16px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand img{width:48px;height:48px;border-radius:12px}.brand b{font-size:21px}.brand span{display:block;font-size:12px;opacity:.9}
.search{width:100%;height:50px;border:0;border-radius:14px;padding:0 16px;font-size:18px;outline:none}
.container{max-width:760px;margin:auto;padding:14px}.status{font-size:13px;color:#5f6b76;margin:6px 2px 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:700;background:#fff;color:#1261A0;box-shadow:0 1px 4px #0001}
button.primary{background:#1261A0;color:#fff}button.danger{background:#fff0f0;color:#b42318}button.small{padding:8px 10px;font-size:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0000000c}.name{font-weight:800;font-size:17px}.lab{font-size:13px;color:#68737d;margin:4px 0 10px}
.prices{display:flex;gap:8px;margin-bottom:12px}.price{flex:1;background:#f5f8fb;border-radius:10px;padding:8px}.price span{font-size:12px;color:#667}.price b{display:block;font-size:16px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center}.qty{width:70px;height:42px;border:1px solid #d3dbe3;border-radius:10px;text-align:center;font-size:17px}
.mode{display:flex;flex:1}.mode button{flex:1;border:1px solid #d3dbe3;border-radius:10px;box-shadow:none;background:#f8fafc;color:#49535c}.mode button.active{background:#1261A0;color:#fff;border-color:#1261A0}
.empty{text-align:center;padding:28px 10px;color:#6b7580}.order{margin-top:18px}.orderhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.order h2{font-size:19px;margin:0}
.item{background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px}.itemtop{display:flex;justify-content:space-between;gap:10px}.itemname{font-weight:700}.sub{font-size:13px;color:#667;margin-top:3px}
.total{background:#17202a;color:#fff;border-radius:16px;padding:15px;margin-top:10px;display:flex;justify-content:space-between;font-size:20px;font-weight:800}.share{width:100%;margin-top:10px;background:#16a34a;color:#fff}
.badge{display:inline-block;background:#e9f7ee;color:#137333;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="icon-180.png" alt="Balbin">
    <div><b>Balbin – Presupuesto</b><span>Consulta de precios y cotización</span></div>
  </div>
  <input id="search" class="search" type="search" placeholder="Buscar producto..." autocomplete="off">
</header>
<main class="container">
  <div class="actions">
    <button id="refresh" class="primary">🔄 Actualizar precios</button>
    <button id="clear" class="danger">🧹 Limpiar pantalla</button>
  </div>
  <div id="status" class="status">Cargando lista maestra…</div>
  <div id="results"></div>

  <section class="order">
    <div class="orderhead">
      <h2>🛒 Cotización</h2>
      <button id="emptyOrder" class="danger small">Vaciar</button>
    </div>
    <div id="orderItems"><div class="empty">Agrega productos para empezar.</div></div>
    <div id="total" class="total"><span>TOTAL</span><span>S/ 0.00</span></div>
    <button id="share" class="share">📲 Compartir cotización</button>
  </section>
</main>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
let products=[], matches=[], order=[], modes=new Map();

const $=id=>document.getElementById(id);
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/^\.+/,"").toUpperCase().replace(/[^A-Z0-9Ñ ]/g," ").replace(/\s+/g," ").trim();
const money=n=>"S/ "+Number(n||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(typeof v==="number")return v;let n=parseFloat(String(v??"").replace(/S\/|,/g,"").trim());return Number.isFinite(n)?n:0};

async function loadMaster(){
  $("status").textContent="🔄 Leyendo Excel maestro…";
  try{
    const res=await fetch("precios.xlsx?v="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("No se encontró precios.xlsx ("+res.status+").");
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{defval:""});
    if(!raw.length) throw new Error("El Excel maestro está vacío.");
    const key=(obj,w)=>Object.keys(obj).find(k=>norm(k)===norm(w));
    const out=[];
    for(const r of raw){
      const kp=key(r,"PRODUCTO"), kc=key(r,"PRECIO"), ku=key(r,"PRECIOF"), kl=key(r,"LABORATORI");
      if(!kp||String(r[kp]).trim()==="") continue;
      out.push({producto:String(r[kp]).trim(),precioCaja:num(kc?r[kc]:0),precioUnidad:num(ku?r[ku]:0),laboratorio:kl?String(r[kl]).trim():""});
    }
    if(!out.length) throw new Error("No encontré PRODUCTO en el Excel.");
    products=out;
    $("status").innerHTML='<span class="badge">✓ Lista maestra actualizada</span> '+products.length.toLocaleString("es-PE")+" productos";
    render();
  }catch(e){
    $("status").textContent="⚠️ "+e.message+" Revisa que precios.xlsx esté en la raíz del sitio.";
  }
}

function render(){
  const q=norm($("search").value);
  if(!q){$("results").innerHTML='<div class="empty">Escribe el nombre o las primeras letras del producto.</div>';return;}
  matches=products.filter(p=>norm(p.producto).includes(q)).slice(0,80);
  if(!matches.length){$("results").innerHTML='<div class="empty">No encontré productos con esa búsqueda.</div>';return;}
  $("results").innerHTML=matches.map((p,i)=>{
    const m=modes.get(p.producto)||"unidad";
    return `<div class="card"><div class="name">${esc(p.producto.replace(/^\./,""))}</div>
    <div class="lab">${esc(p.laboratorio||"Laboratorio no indicado")}</div>
    <div class="prices"><div class="price"><span>UNIDAD</span><b>${money(p.precioUnidad)}</b></div>
    <div class="price"><span>CAJA</span><b>${money(p.precioCaja)}</b></div></div>
    <div class="row"><input class="qty" id="q${i}" type="number" min="1" step="1" value="1">
    <div class="mode"><button class="${m==="unidad"?"active":""}" onclick="setMode(${i},'unidad')">Unidad</button>
    <button class="${m==="caja"?"active":""}" onclick="setMode(${i},'caja')">Caja</button></div>
    <button class="primary small" onclick="add(${i})">Agregar</button></div></div>`;
  }).join("");
}
function setMode(i,m){modes.set(matches[i].producto,m);render();}
function add(i){
  const p=matches[i],m=modes.get(p.producto)||"unidad",q=Math.max(1,parseInt($("q"+i).value||"1",10));
  const price=m==="caja"?p.precioCaja:p.precioUnidad,key=p.producto+"|"+m;
  const x=order.find(v=>v.key===key);
  if(x)x.qty+=q;else order.push({key,producto:p.producto,laboratorio:p.laboratorio,mode:m,qty:q,price});
  renderOrder();
}
function renderOrder(){
  if(!order.length){$("orderItems").innerHTML='<div class="empty">Agrega productos para empezar.</div>';$("total").innerHTML="<span>TOTAL</span><span>S/ 0.00</span>";return;}
  $("orderItems").innerHTML=order.map((x,i)=>`<div class="item"><div class="itemtop"><div><div class="itemname">${esc(x.producto.replace(/^\./,""))}</div><div class="sub">${x.qty} ${x.mode}</div></div><strong>${money(x.qty*x.price)}</strong></div>
  <div class="row" style="margin-top:8px"><button class="small" onclick="chg(${i},-1)">−</button><button class="small" onclick="chg(${i},1)">+</button><button class="danger small" onclick="del(${i})">Eliminar</button></div></div>`).join("");
  const t=order.reduce((s,x)=>s+x.qty*x.price,0);$("total").innerHTML=`<span>TOTAL</span><span>${money(t)}</span>`;
}
function chg(i,d){order[i].qty+=d;if(order[i].qty<=0)order.splice(i,1);renderOrder()}
function del(i){order.splice(i,1);renderOrder()}
function clearAll(){$("search").value="";order=[];modes.clear();render();renderOrder();window.scrollTo({top:0,behavior:"smooth"})}
$("search").addEventListener("input",render);
$("clear").onclick=clearAll;
$("emptyOrder").onclick=()=>{order=[];renderOrder()};
$("refresh").onclick=loadMaster;
$("share").onclick=async()=>{
 if(!order.length){alert("Primero agrega productos.");return}
 const lines=order.map(x=>`${x.producto.replace(/^\./,"")} — ${x.qty} ${x.mode} — ${money(x.qty*x.price)}`);
 const total=order.reduce((s,x)=>s+x.qty*x.price,0);
 const text="BALBIN – PRESUPUESTO\n\n"+lines.join("\n")+"\n\nTOTAL: "+money(total);
 if(navigator.share){try{await navigator.share({title:"Balbin – Presupuesto",text})}catch(e){}}else{window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
};
loadMaster();renderOrder();
</script>
</body>
</html>
